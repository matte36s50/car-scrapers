name: Backfill Auction Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date for backfill (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End date for backfill (YYYY-MM-DD)'
        required: true
        type: string
      source:
        description: 'Which scraper(s) to run'
        required: true
        type: choice
        options:
          - both
          - bat
          - cnb
        default: both
      max_auctions:
        description: 'Max auctions per scraper (leave blank for scraper defaults; use ~3000 for a full month of BAT)'
        required: false
        type: string
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache Playwright browsers
      uses: actions/cache@v3
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-1091
        restore-keys: |
          ${{ runner.os }}-playwright-

    - run: pip install -r requirements.txt

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install chromium

    - name: Install Playwright deps (cached)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: playwright install-deps chromium

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Dispatch inputs reach bash through env, never through ${{ }} interpolation.
    # An expression is substituted into the script BEFORE bash parses it, so a
    # backtick or $(...) in an input is read as shell, not as text — on a runner
    # holding AWS and Supabase credentials. A mistyped date ("2026-09-1`7")
    # already broke this step once; the same hole executes commands.
    - name: Build CLI args
      id: args
      env:
        START_DATE: ${{ github.event.inputs.start_date }}
        END_DATE: ${{ github.event.inputs.end_date }}
        MAX_AUCTIONS: ${{ github.event.inputs.max_auctions }}
      run: |
        set -euo pipefail
        for v in "$START_DATE" "$END_DATE"; do
          [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error ::Dates must be YYYY-MM-DD; got '$v'"; exit 1; }
        done
        if [ -n "$MAX_AUCTIONS" ]; then
          [[ "$MAX_AUCTIONS" =~ ^[0-9]+$ ]] || {
            echo "::error ::max_auctions must be a whole number; got '$MAX_AUCTIONS'"; exit 1; }
        fi
        A="--start-date $START_DATE --end-date $END_DATE"
        if [ -n "$MAX_AUCTIONS" ]; then
          A="$A --max-auctions $MAX_AUCTIONS"
        fi
        echo "cli=$A" >> "$GITHUB_OUTPUT"

    - name: Run BAT scraper
      if: ${{ github.event.inputs.source == 'bat' || github.event.inputs.source == 'both' }}
      run: python bat_scraper.py ${{ steps.args.outputs.cli }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      continue-on-error: true

    - name: Run CNB scraper
      if: ${{ github.event.inputs.source == 'cnb' || github.event.inputs.source == 'both' }}
      run: python cnb_scraper.py ${{ steps.args.outputs.cli }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      continue-on-error: true

    - name: Summary
      env:
        SOURCE: ${{ github.event.inputs.source }}
        START_DATE: ${{ github.event.inputs.start_date }}
        END_DATE: ${{ github.event.inputs.end_date }}
      if: always()
      run: |
        echo "Backfill complete: $SOURCE | $START_DATE → $END_DATE"
