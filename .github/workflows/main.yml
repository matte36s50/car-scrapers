name: BAT and CNB Scraper Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Run CNB Scraper
      run: |
        echo "=========================================="
        echo "Starting Cars & Bids scraper..."
        echo "=========================================="
        python cnb_scraper.py || echo "CNB scraper encountered errors"
      continue-on-error: true
      
    - name: Upload CNB results to S3
      if: always()
      run: |
        if ls cnb*.csv 1> /dev/null 2>&1; then
          for file in cnb*.csv; do
            aws s3 cp "$file" s3://my-mii-reports/scraped-data/
            echo "Uploaded $file to S3"
          done
        else
          echo "No CNB CSV files found"
        fi
      continue-on-error: true
      
    - name: Wait between scrapers
      run: |
        echo "Waiting 60 seconds before BAT scraper..."
        sleep 60
        
    - name: Run BAT Scraper
      run: |
        echo "=========================================="
        echo "Starting Bring a Trailer scraper..."
        echo "=========================================="
        python bat_scraper.py || echo "BAT scraper encountered errors"
      continue-on-error: true
      
    - name: Upload BAT results to S3
      if: always()
      run: |
        if ls bat*.csv 1> /dev/null 2>&1; then
          for file in bat*.csv; do
            aws s3 cp "$file" s3://my-mii-reports/scraped-data/
            echo "Uploaded $file to S3"
          done
        else
          echo "No BAT CSV files found"
        fi
      continue-on-error: true
      
    - name: Run MII Calculator
      run: |
        echo "=========================================="
        echo "Starting MII calculations..."
        echo "=========================================="
        python enhanced_mii_all_models.py || echo "MII calculator encountered errors"
      continue-on-error: true
      
    - name: Upload MII reports to S3
      if: always()
      run: |
        if ls mii*.csv 1> /dev/null 2>&1; then
          for file in mii*.csv; do
            aws s3 cp "$file" s3://my-mii-reports/reports/
            echo "Uploaded $file to S3"
          done
        fi
        if ls *.json 1> /dev/null 2>&1; then
          for file in *.json; do
            aws s3 cp "$file" s3://my-mii-reports/reports/
            echo "Uploaded $file to S3"
          done
        fi
        echo "All MII reports uploaded to S3"
      continue-on-error: true
      
    - name: Upload artifacts for debugging
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scraping-logs-${{ github.run_number }}
        path: |
          *.log
          *.txt
        retention-days: 7
        
    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Pipeline completed!"
        echo "=========================================="
        echo "Check S3 bucket 'my-mii-reports' for results:"
        echo "  - scraped-data/ (CNB and BAT CSV files)"
        echo "  - reports/ (MII analysis files)"
        echo "=========================================="
