name: BAT and CNB Scraper Pipeline
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
jobs:
  scrape-and-analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Cache Playwright browsers
      uses: actions/cache@v3
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-1091
        restore-keys: |
          ${{ runner.os }}-playwright-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        playwright install chromium
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 300000
    
    - name: Ensure Playwright browsers are available
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: |
        playwright install-deps chromium
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Download existing data from S3
      run: |
        echo "=========================================="
        echo "Downloading existing data from S3..."
        echo "=========================================="
        
        # Download existing CNB data (if it exists)
        if aws s3 ls s3://my-mii-reports/cnb.csv; then
          aws s3 cp s3://my-mii-reports/cnb.csv cnb.csv
          echo "✓ Downloaded cnb.csv ($(wc -l < cnb.csv) rows)"
        else
          echo "⚠️ No existing cnb.csv in S3 (scrapers will create new file)"
        fi
        
        # Download existing BAT data (if it exists)
        if aws s3 ls s3://my-mii-reports/bat.csv; then
          aws s3 cp s3://my-mii-reports/bat.csv bat.csv
          echo "✓ Downloaded bat.csv ($(wc -l < bat.csv) rows)"
        else
          echo "⚠️ No existing bat.csv in S3 (scrapers will create new file)"
        fi

        # Download persisted social score cache (accumulates coverage over runs)
        if aws s3 ls s3://my-mii-reports/cache/social_score_cache.json; then
          aws s3 cp s3://my-mii-reports/cache/social_score_cache.json social_score_cache.json
          echo "✓ Downloaded social_score_cache.json"
        else
          echo "⚠️ No existing social_score_cache.json in S3 (will be created)"
        fi

        echo ""
        echo "Files ready for scrapers:"
        ls -lh *.csv 2>/dev/null || echo "Starting fresh (no existing files)"
        
    - name: Run CNB Scraper
      run: |
        echo "=========================================="
        echo "Starting Cars & Bids scraper..."
        echo "=========================================="
        python cnb_scraper.py || echo "CNB scraper encountered errors"
      continue-on-error: true
      
    - name: Upload CNB results to S3
      if: always()
      run: |
        if [ -f cnb.csv ]; then
          aws s3 cp cnb.csv s3://my-mii-reports/cnb.csv
          echo "✓ Uploaded cnb.csv to S3 ($(wc -l < cnb.csv) rows)"
        else
          echo "⚠️ No cnb.csv file found to upload"
        fi
      continue-on-error: true
      
    - name: Wait between scrapers
      run: |
        echo "Waiting 60 seconds before BAT scraper..."
        sleep 60
        
    - name: Run BAT Scraper
      run: |
        echo "=========================================="
        echo "Starting Bring a Trailer scraper..."
        echo "=========================================="
        python bat_scraper.py || echo "BAT scraper encountered errors"
      continue-on-error: true
      
    - name: Upload BAT results to S3
      if: always()
      run: |
        if [ -f bat.csv ]; then
          aws s3 cp bat.csv s3://my-mii-reports/bat.csv
          echo "✓ Uploaded bat.csv to S3 ($(wc -l < bat.csv) rows)"
        else
          echo "⚠️ No bat.csv file found to upload"
        fi
      continue-on-error: true
      
    - name: Run MII Calculator
      run: |
        echo "=========================================="
        echo "Starting MII calculations..."
        echo "=========================================="
        
        # Show what files are available
        echo "Files available for MII calculation:"
        ls -lh cnb.csv bat.csv 2>/dev/null || echo "Warning: Some files may be missing"
        
        python enhanced_mii_all_models.py || echo "MII calculator encountered errors"

        # Create mii_results_latest.csv for backward compatibility with website
        if [ -f mii_individual_auctions.csv ]; then
          cp mii_individual_auctions.csv mii_results_latest.csv
          echo "✓ Created mii_results_latest.csv (copy of individual auctions)"
        fi
      env:
        # Social score sub-signal credentials. All optional: when a secret is
        # unset, that collector returns no data and its weight renormalizes out.
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        SOCIAL_IGTT_PROVIDER: ${{ secrets.SOCIAL_IGTT_PROVIDER }}
        # Per-run YouTube quota cap (units; search.list = 100, free tier 10k/day).
        # Defaults to 9000 in code; the scheduled runs (06:00 & 18:00 UTC) share
        # the daily quota, so cap each well under 10k.
        YOUTUBE_QUOTA_BUDGET: '4500'
      continue-on-error: true

    - name: Persist social score cache to S3
      if: always()
      run: |
        if [ -f social_score_cache.json ]; then
          aws s3 cp social_score_cache.json s3://my-mii-reports/cache/social_score_cache.json
          echo "✓ Persisted social_score_cache.json to S3"
        else
          echo "⚠️ No social_score_cache.json to persist"
        fi
      continue-on-error: true
      
    - name: Upload MII reports to S3
      if: always()
      run: |
        echo "=========================================="
        echo "Uploading MII reports to S3..."
        echo "=========================================="
        
        # Upload latest results (for website compatibility)
        if [ -f mii_results_latest.csv ]; then
          aws s3 cp mii_results_latest.csv s3://my-mii-reports/reports/mii_results_latest.csv
          echo "✓ Uploaded mii_results_latest.csv ($(wc -l < mii_results_latest.csv) rows)"
        fi
        
        # Upload individual auction results
        if [ -f mii_individual_auctions.csv ]; then
          aws s3 cp mii_individual_auctions.csv s3://my-mii-reports/reports/mii_individual_auctions.csv
          echo "✓ Uploaded mii_individual_auctions.csv ($(wc -l < mii_individual_auctions.csv) rows)"
        fi
        
        # Upload model summary
        if [ -f mii_model_summary.csv ]; then
          aws s3 cp mii_model_summary.csv s3://my-mii-reports/reports/mii_model_summary.csv
          echo "✓ Uploaded mii_model_summary.csv"
        fi
        
        # Upload manufacturer summary
        if [ -f mii_manufacturer_summary.csv ]; then
          aws s3 cp mii_manufacturer_summary.csv s3://my-mii-reports/reports/mii_manufacturer_summary.csv
          echo "✓ Uploaded mii_manufacturer_summary.csv"
        fi
        
        # Upload any JSON files
        if ls *.json 1> /dev/null 2>&1; then
          for file in *.json; do
            aws s3 cp "$file" s3://my-mii-reports/reports/
            echo "✓ Uploaded $file"
          done
        fi
        
        echo "All MII reports uploaded to S3"
      continue-on-error: true
      
    - name: Upload artifacts for debugging
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scraping-logs-${{ github.run_number }}
        path: |
          *.log
          *.txt
        retention-days: 7
        
    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Pipeline completed!"
        echo "=========================================="
        echo "Check S3 bucket 'my-mii-reports' for results:"
        echo "  - cnb.csv (CNB auction data)"
        echo "  - bat.csv (BAT auction data)"
        echo "  - reports/mii_individual_auctions.csv (Individual MII scores)"
        echo "  - reports/mii_model_summary.csv (Model summaries)"
        echo "  - reports/mii_manufacturer_summary.csv (Manufacturer summaries)"
        echo "=========================================="
